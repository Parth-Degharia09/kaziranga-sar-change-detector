name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the web app folder
        id: find
        run: |
          f=$(find . -path ./.git -prune -o -name index.html -path '*frontend*' -print | head -n1)
          if [ -z "$f" ]; then
            f=$(find . -path ./.git -prune -o -name index.html -print | head -n1)
          fi
          if [ -z "$f" ]; then
            echo "No index.html found. Files in this repo:"
            find . -maxdepth 4 -not -path './.git*'
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Deploying folder: $dir"
          ls -la "$dir"
          if [ ! -d "$dir/data" ]; then echo "WARNING: no data/ folder next to index.html, the map will be empty"; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find.outputs.dir }}

      - id: deployment
        uses: actions/deploy-pages@v4
